name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    # Builds the library on the floor declared in Cargo.toml. It builds rather
    # than tests, because the floor is a promise to people who depend on this
    # crate, and they never compile its dev-dependencies.
    #
    # The floor is 1.85 and not lower because that is where a toolchain can
    # still read the dependency tree. An older cargo has no MSRV-aware
    # resolver, so it takes the newest version of every transitive dependency;
    # rustls pulls one that declares edition 2024, which cargo could not parse
    # before 1.85. A lower number here would be a claim no one could act on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo build
