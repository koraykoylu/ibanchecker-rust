name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    # Builds the library on the floor declared in Cargo.toml. It builds rather
    # than tests, because the floor is a promise to people who depend on this
    # crate, and they never compile its dev-dependencies.
    #
    # The floor is what the dependency tree actually needs, found by running
    # this job rather than guessed. 1.75 failed because a cargo that old has no
    # MSRV-aware resolver and cannot even parse a transitive dependency
    # declaring edition 2024. 1.85 then reported the real constraint plainly:
    # icu_collections, which arrives under url, requires 1.88. A lower number
    # here would be a claim no one could act on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo build
