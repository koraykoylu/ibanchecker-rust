[package]
name = "ibanchecker"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Official Rust client for the ibanchecker.cash IBAN validation API: validate IBANs across 92 countries, extract IBANs from text, and look up SWIFT/BIC codes."
license = "MIT"
repository = "https://github.com/koraykoylu/ibanchecker-rust"
homepage = "https://ibanchecker.cash"
documentation = "https://docs.rs/ibanchecker"
readme = "README.md"
keywords = ["iban", "bic", "swift", "sepa", "fintech"]
categories = ["api-bindings", "finance"]
# Our own release machinery, not something every consumer should unpack.
exclude = ["PUBLISHING.md", ".github/", ".gitignore"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
